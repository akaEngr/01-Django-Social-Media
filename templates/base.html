{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    {% block css %}{% endblock %}
</head>
<body>

    {% include "nav.html" %}
    <hr>

    {% if messages %}
        {% for msg in messages %}
            <p>{{msg}}</p>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
    {% block js %}{% endblock %}

    
</body>
</html>
