{% extends "base.html" %}

{% block content %}
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save</button>
</form>

{% if profile and profile.profile_photo %}
    <img src="{{ profile.profile_photo.url }}" width="150">
{% else %}
    <p>No image uploaded.</p>
{% endif %}

{% endblock %}
